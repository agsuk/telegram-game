
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Поймай квадрат</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <main class="game">
    <h1>Поймай квадрат!</h1>

    <p id="player">Привет, игрок!</p>

    <p>Очки: <span id="score">0</span></p>
    <p>Рекорд: <span id="record">0</span></p>

    <div id="field">
      <button id="target" aria-label="Поймать квадрат"></button>
    </div>

    <button id="start">Начать игру</button>
  </main>

</body>
</html>
